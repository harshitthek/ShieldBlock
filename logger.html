<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShieldBlock - Live Network Logger</title>
  <link rel="stylesheet" href="logger.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="logger-container">
    <!-- Header -->
    <header class="logger-header">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <h1>ShieldBlock Live Network Logger</h1>
        <span class="live-badge">REC ● LIVE</span>
      </div>

      <div class="header-actions">
        <input type="text" id="log-search" placeholder="Filter by URL or domain..." />
        <button id="clear-logs-btn" class="btn btn-secondary">Clear Logs</button>
      </div>
    </header>

    <!-- Content Table -->
    <main class="logger-content">
      <table class="log-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Resource Type</th>
            <th>Ruleset</th>
            <th>Rule ID</th>
            <th>Blocked URL</th>
          </tr>
        </thead>
        <tbody id="log-table-body">
          <!-- Live rows injected here -->
        </tbody>
      </table>
      <div id="empty-state" class="empty-state">
        <p>Listening for blocked network requests... (Visit any website to see real-time blocks)</p>
      </div>
    </main>
  </div>

  <script src="logger.js"></script>
</body>
</html>
