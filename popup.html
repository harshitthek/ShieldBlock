<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShieldBlock Popup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="brand-info">
          <h1>ShieldBlock</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
      <button id="open-options-btn" class="icon-btn" title="Open Settings & Dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </header>

    <!-- Domain Card -->
    <div class="domain-card" id="domain-card">
      <div class="domain-details">
        <span class="domain-favicon" id="domain-favicon">🌐</span>
        <span class="domain-name" id="domain-name">Loading...</span>
      </div>
      <span class="status-pill protected" id="domain-status-pill">Active</span>
    </div>

    <!-- Power Toggle Shield Area -->
    <div class="power-section">
      <div class="power-ring" id="power-ring">
        <button class="power-btn" id="power-btn" title="Toggle Global Protection">
          <svg class="shield-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </button>
      </div>
      <span class="power-status-text" id="power-status-text">Protection Enabled</span>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-number" id="stat-page">0</span>
        <span class="stat-label">On This Page</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="stat-total">0</span>
        <span class="stat-label">Total Blocked</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="stat-saved">0 MB</span>
        <span class="stat-label">Data Saved</span>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="actions-group">
      <button class="action-btn" id="whitelist-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
        <span id="whitelist-btn-text">Pause on This Site</span>
      </button>

      <button class="action-btn" id="picker-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M3 12h3m12 0h3M12 3v3m0 12v3"/>
        </svg>
        <span>Block Element</span>
      </button>

      <button class="action-btn" id="zapper-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Zap Element (Temp)</span>
      </button>

      <button class="action-btn" id="logger-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>Live Logger</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-tag">Declarative V3 Shield Active</span>
      <a href="options.html" target="_blank" class="dashboard-link">Dashboard &rarr;</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
